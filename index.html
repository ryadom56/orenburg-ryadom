<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff"><title>Оренбург рядом — объявления</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#">Оренбург<span>рядом</span></a>

  <div class="top-actions">

    <button id="addOpen" class="btn primary">
      ＋ Разместить объявление
    </button>

    <div id="accountMenu" class="account-menu">

      <button type="button" id="profileMenuOpen" class="account-menu-item">
        👤 Мой профиль
      </button>

      <button id="messagesOpen" class="account-menu-item">
        ✉ Сообщения
      </button>

      <button id="favoritesOpen" class="account-menu-item">
        ♡ Избранное
      </button>

    </div>

    <button id="loginOpen" class="btn light">Войти</button>

  </div>
</header>
<main class="wrap">
 <section class="hero" id="heroSection">
  <div class="searchbar">
    <input id="search" placeholder="Что ищем? Например, iPhone или диван">

    <select id="category">
      <option value="">Все категории</option>
      <option>Авто и запчасти</option>
      <option>Недвижимость</option>
      <option>Электроника</option>
      <option>Одежда и обувь</option>
      <option>Дом и ремонт</option>
      <option>Работа</option>
      <option>Услуги</option>
      <option>Животные</option>
      <option>Разное</option>
    </select>

    <button id="searchBtn" class="btn primary">Найти</button>
  </div>
</section>

<section class="section-head">
  <div>
    <h2 id="listingHeading">Свежие объявления</h2>
    <p id="status">Загружаем объявления…</p>
  </div>

  <select id="sort">
    <option value="new">Сначала новые</option>
    <option value="cheap">Сначала дешевле</option>
    <option value="expensive">Сначала дороже</option>
  </select>
</section>

<section id="grid" class="grid"></section>

<section id="messagesPage" class="wrap" style="display:none;padding-top:30px">
  <button type="button" id="messagesBack" class="btn light">← Назад к объявлениям</button>
  <div class="profile-card" style="margin-top:20px">
    <h2>Сообщения</h2>
    <div id="conversationsList">
      <p>Здесь будут твои диалоги.</p>
    </div>
    <div id="chatWindow" style="display:none"></div>
  </div>
</section>

<section id="listingPage" class="wrap" style="display:none;padding-top:30px">

  <button type="button" id="listingPageBack" class="btn light">
    ← Назад к объявлениям
  </button>

  <div id="listingPageContent"></div>

</section>
  
<footer>© <span id="year"></span> Оренбург рядом · Сделано для жителей региона</footer>

<script defer src="app.js"></script>
  
</body></html>
